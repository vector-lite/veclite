server:
  port: 8080

veclite:
  enabled: true
  web:
    enabled: true
    base-path: /veclite/api/v1
  # Embedding 数据源已改为数据库维护：通过数据源管理页或 /embedding/models 接口增删改查
  storage:
    # 数据库持久化后端全局开关：MONGODB | POSTGRES
    type: MONGODB
    mongodb:                  # type=MONGODB 时生效
      uri: mongodb://admin:12345678@localhost:27017/?authSource=admin
      database: veclite
      meta-collection: veclite_store_meta
      scan-batch-size: 1000
    postgres:                 # type=POSTGRES 时生效（建表见 src/main/resources/schema/veclite_postgres.sql）
      jdbc-url: jdbc:postgresql://localhost:5432/veclite
      username: ${POSTGRES_USER:veclite}
      password: ${POSTGRES_PASSWORD:veclite}
      meta-table: veclite_store_meta
      embedding-model-table: veclite_embedding_model
      fetch-size: 1000
    payload:
      mode: MEMORY
    # 增量同步调度（文档型后端专用）：按元数据水位从真相源拉取变更收敛内存投影，
    # 替代定时全量重载；多节点部署建议开启。写透已保证 RPO=0，单节点部署无需开启。
    sync:
      enabled: true
      interval-seconds: 10
      retention-days: 3       # 软删除 tombstone 物理保留天数，<=0 不清理
  # 数据库写入前是否强制校验 vec / payload / idIndex 三者 size 一致；
  # true 时校验失败直接抛 ConsistencyException 阻止写入，false 时跳过校验（默认）
  consistency:
    strict: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    veclite.persistence.AbstractDocumentPersistence: info
    veclite.engine.StoreSyncScheduler: info
