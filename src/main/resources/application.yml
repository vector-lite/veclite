server:
  port: 8080

veclite:
  enabled: true
  web:
    enabled: true
    base-path: /veclite/api/v1
  # Embedding 数据源已改为数据库维护：通过数据源管理页或 /embedding/models 接口增删改查
  storage:
    type: MONGODB
    mongodb:
      uri: mongodb://admin:12345678@localhost:27017/?authSource=admin
      database: veclite
      document-collection: veclite_document
      meta-collection: veclite_store_meta
      scan-batch-size: 1000
    snapshot-file:            # 切回 SNAPSHOT_FILE 模式时生效
      base-path: ./data/vector-lite
      flush-interval-seconds: 30
      flush-on-shutdown: true
    payload:
      mode: MEMORY

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
