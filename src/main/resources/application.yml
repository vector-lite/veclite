server:
  port: 8088

veclite:
  enabled: true
  web:
    enabled: true
    base-path: /veclite/api/v1
  # Embedding 接口管理：模型名称 + 版本是绑定 Store 的重要参数（绑定后不可变）
  embedding:
    default-model: text-embedding-v3
    models:
      text-embedding-v3:
        name: text-embedding-v3
        version: "v3"
        provider: dashscope
        url: https://llm-dij67chcqa06gb7k.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/embeddings
        api-key: ${DASHSCOPE_API_KEY}
        timeout-millis: 30000
        batch-size: 8
  storage:
    type: OSS
    snapshot-file:
      base-path: ./data/vector-lite
      flush-interval-seconds: 30
      flush-on-shutdown: true
    oss:
      endpoint: oss-cn-beijing.aliyuncs.com
      bucket: java-lhy
      key-prefix: veclite/
      retry-times: 3
      retry-backoff-ms: 500
      connect-timeout-ms: 5000
      read-timeout-ms: 30000
    payload:
      mode: MEMORY

  # 内部一致性配置（v2.4 § 4.4）
  # strict=true：assertConsistency 失败时直接抛 ConsistencyException，saveStore 落盘被阻止（生产推荐）
  # strict=false：失败时打 ERROR 继续落盘（开发/调试用，可观察但可能写脏数据）
  consistency:
    strict: true

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/veclite
    username: ${POSTGRES_USER:veclite}
    password: ${POSTGRES_PASSWORD:veclite}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
